[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airshare-lan"
version = "1.0.0"
description = "Huawei-style touchless gesture screenshot & laptop transfer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "flask",
    "opencv-python",
    "mediapipe",
    "mss",
    "requests",
    "numpy",
]

[project.scripts]
airshare = "airshare.app:main"

[tool.setuptools.packages.find]
include = ["airshare*"]
